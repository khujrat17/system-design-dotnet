name: Bug or mistake
description: Something is broken, or an explanation or demo is wrong
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Concept number, page, or file
      placeholder: "Concept 11, Run tab"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, .NET 10.0.100, Edge"
